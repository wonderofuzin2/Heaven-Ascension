    // Estado
    let evolutionState = {};
    let activeFilter = "all";
    let activeTab = "stands";

    // Inicializar estados
    function initEvolutionState() {
        for (let key in evolutiveData) {
            evolutionState[key] = 0;
        }
    }

    // Evoluir Stand
    function evolveStand(evolutionId, event) {
        if (event) event.stopPropagation();
        const data = evolutiveData[evolutionId];
        if (!data) return;
        
        const current = evolutionState[evolutionId];
        const next = (current + 1) % data.forms.length;
        evolutionState[evolutionId] = next;
        
        const card = document.querySelector(`.stand-card[data-evo='${evolutionId}']`);
        if (card) {
            card.classList.add('evolving');
            setTimeout(() => card.classList.remove('evolving'), 500);
        }
        
        renderStands();
    }

    function resetStand(evolutionId, event) {
        if (event) event.stopPropagation();
        evolutionState[evolutionId] = 0;
        renderStands();
    }

    function getEvolutiveDisplay(stand) {
        if (stand.isEvolutive && stand.evolutionId && evolutiveData[stand.evolutionId]) {
            const evo = evolutiveData[stand.evolutionId];
            const currentFormIndex = evolutionState[stand.evolutionId] || 0;
            const currentForm = evo.forms[currentFormIndex];
            const nextFormName = evo.forms[(currentFormIndex + 1) % evo.forms.length].name;
            const isMaxForm = currentFormIndex === evo.forms.length - 1;
            
            return {
                isEvolutive: true,
                displayName: currentForm.name,
                displayDesc: currentForm.desc,
                displayStats: currentForm.stats,
                displayGradient: currentForm.gradient,
                nextFormName: nextFormName,
                isMaxForm: isMaxForm,
                evolutionId: stand.evolutionId,
                currentFormIndex: currentFormIndex,
                totalForms: evo.forms.length
            };
        }
        return {
            isEvolutive: false,
            displayName: stand.name,
            displayDesc: stand.desc,
            displayStats: stand.stats,
            displayGradient: stand.gradient
        };
    }

    // Renderizar STANDS
    function renderStands() {
        let filtered = [...standsNormais];
        
        if (activeFilter !== "all" && activeFilter !== "Evolutivo") {
            filtered = standsNormais.filter(stand => stand.parte === activeFilter);
        } else if (activeFilter === "Evolutivo") {
            filtered = standsNormais.filter(stand => stand.isEvolutive === true);
        }
        
        document.getElementById('totalCounter').innerHTML = `🎴 ${filtered.length} STANDS ${activeFilter !== "all" ? `· ${activeFilter}` : "· 50 STANDS"}`;
        
        const container = document.getElementById('standsContainer');
        container.innerHTML = filtered.map(stand => {
            const evo = getEvolutiveDisplay(stand);
            const actBadgeText = evo.isEvolutive ? 
                (evo.displayName.includes("ACT") ? evo.displayName.split(" ")[1] : 
                (evo.displayName.includes("Requiem") ? "REQUIEM" : 
                (evo.displayName.includes("The World") && evo.displayName !== "The World" ? "EVOLVED" : 
                (evo.currentFormIndex > 0 ? `FORM ${evo.currentFormIndex +1}/${evo.totalForms}` : "BASE")))) : "";
            
            return `
                <div class="stand-card" data-id="${stand.id}" data-evo="${stand.evolutionId || ''}" onclick="openStandModal(${stand.id})">
                    <div class="stand-preview" style="background: ${getImagemStand(stand.name, evo.displayName, evo.displayGradient)}; background-size: cover; background-position: center; background-blend: overlay; min-height: 220px;">
                        <span class="part-tag"><i class="fas fa-tag"></i> ${stand.parte}</span>
                        ${evo.isEvolutive && actBadgeText ? `<span class="act-badge"><i class="fas fa-star"></i> ${actBadgeText}</span>` : ''}
                    </div>
                    <div class="stand-content">
                        <div class="stand-title">
                            ${evo.displayName}
                            ${evo.isEvolutive ? `<button class="reset-btn" onclick="resetStand('${stand.evolutionId}', event)" title="Resetar"><i class="fas fa-undo-alt"></i></button>` : ''}
                        </div>
                        <div class="stand-user"><i class="fas fa-user-astronaut"></i> ${stand.user}</div>
                        <div class="stand-desc">${evo.displayDesc}</div>
                        <div class="stats-row">
                            ${evo.displayStats.map(s => `<span class="stat-chip"><i class="fas fa-chart-simple"></i> ${s}</span>`).join('')}
                        </div>
                        ${evo.isEvolutive ? `
                            <button class="evo-btn" onclick="evolveStand('${stand.evolutionId}', event)">
                                <i class="fas ${evo.isMaxForm ? 'fa-arrow-rotate-left' : 'fa-arrow-up'}"></i>
                                ${evo.isMaxForm ? `VOLTAR` : `EVOLUIR PARA ${evo.nextFormName}`}
                            </button>
                        ` : `
                            <button class="btn-details" onclick="event.stopPropagation(); openStandModal(${stand.id})"><i class="fas fa-eye"></i> VER DETALHES</button>
                        `}
                    </div>
                </div>
            `;
        }).join('');
        
        if (filtered.length === 0) {
            container.innerHTML = '<div class="no-results"><i class="fas fa-search"></i> Nenhum Stand encontrado para este filtro.</div>';
        }
    }

// Função para obter imagem do portador
function getImagemPortador(nomePortador) {
    if (imagensPortadores[nomePortador]) {
        return imagensPortadores[nomePortador];
    }
    // Fallback: gradiente padrão
    return null;
}

// Função para obter a imagem do Stand
function getImagemStand(nomeStand, nomeForma, gradient) {
    // Primeiro verifica se é uma forma evolutiva
    if (nomeForma && imagensEvolutivas[nomeForma]) {
        return `url('${imagensEvolutivas[nomeForma]}')`;
    }
    // Depois verifica o Stand normal
    if (imagensStands[nomeStand]) {
        return `url('${imagensStands[nomeStand]}')`;
    }
    // Fallback: gradiente
    return gradient;
}

    // Renderizar PORTADORES
    function renderPortadores() {
        let filtered = [...portadores];
        
        if (activeFilter !== "all") {
            filtered = portadores.filter(p => p.parte === activeFilter);
        }
        
        document.getElementById('totalCounter').innerHTML = `👥 ${filtered.length} PORTADORES ${activeFilter !== "all" ? `· ${activeFilter}` : "· 42 PERSONAGENS"}`;
        
        const container = document.getElementById('standsContainer');
        container.innerHTML = filtered.map(portador => `
            <div class="user-card" onclick="openUserModal('${portador.nome}')">
                <div class="user-preview" style="background: ${getImagemPortador(portador.nome) ? `url('${getImagemPortador(portador.nome)}')` : 'linear-gradient(135deg, #1a1a2e, #16213e)'}; background-size: cover; background-position: center;">
                    <span class="part-tag"><i class="fas fa-tag"></i> ${portador.parte}</span>
                    <span class="act-badge"><i class="fas fa-dragon"></i> ${portador.quantidadeStands} Stand(s)</span>
                </div>
                <div class="user-content">
                    <div class="stand-title">
                        <i class="fas fa-user-circle"></i> ${portador.nome}
                    </div>
                    <div class="stand-desc">${portador.desc}</div>
                    <div class="user-stand-list">
                        ${portador.stands.map(stand => `<span class="user-stand-tag"><i class="fas fa-dice-d6"></i> ${stand}</span>`).join('')}
                    </div>
                    <button class="btn-details" onclick="event.stopPropagation(); openUserModal('${portador.nome}')"><i class="fas fa-info-circle"></i> VER STANDS</button>
                </div>
            </div>
        `).join('');
        
        if (filtered.length === 0) {
            container.innerHTML = '<div class="no-results"><i class="fas fa-search"></i> Nenhum portador encontrado para este filtro.</div>';
        }
    }

    // Modal de Stand
    function openStandModal(standId) {
        const stand = standsNormais.find(s => s.id === standId);
        if (!stand) return;
        const modal = document.getElementById('standModal');
        const modalContent = document.getElementById('modalDynamicContent');
        modalContent.innerHTML = `
            <div class="modal-close" id="closeModalBtnInner">&times;</div>
            <h2 style="color:#ffd966; font-family:Orbitron;"><i class="fas fa-dragon"></i> ${stand.name}</h2>
            <p><i class="fas fa-user"></i> <strong>Portador:</strong> ${stand.user}</p>
            <p><i class="fas fa-tag"></i> <strong>Parte:</strong> ${stand.parte}</p>
            <p style="margin:1rem 0; line-height:1.5;">${stand.fullDesc || stand.desc}</p>
            <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:1rem;">
                ${stand.stats.map(s => `<span style="background:#2e293c; padding:4px 12px; border-radius:30px;"><i class="fas fa-chart-line"></i> ${s}</span>`).join('')}
            </div>
            <hr style="margin:1rem 0; border-color:#f1c40f33;">
            <p style="font-size:0.8rem; color:#aaa;"><i class="fas fa-info-circle"></i> Este é um dos Stands mais emblemáticos do universo JoJo.</p>
        `;
        modal.style.display = 'flex';
        
        const closeFn = () => modal.style.display = 'none';
        setTimeout(() => {
            const closeBtn = document.getElementById('closeModalBtnInner');
            if (closeBtn) closeBtn.onclick = closeFn;
        }, 100);
        document.getElementById('closeModalBtn').onclick = closeFn;
        window.onclick = (e) => { if(e.target === modal) closeFn(); };
    }

    // Modal de Portador
    function openUserModal(userName) {
        const portador = portadores.find(p => p.nome === userName);
        if (!portador) return;
        const modal = document.getElementById('standModal');
        const modalContent = document.getElementById('modalDynamicContent');
        modalContent.innerHTML = `
            <div class="modal-close" id="closeModalBtnInner">&times;</div>
            <h2 style="color:#ffd966; font-family:Orbitron;"><i class="fas fa-user-circle"></i> ${portador.nome}</h2>
            <p><i class="fas fa-tag"></i> <strong>Parte:</strong> ${portador.parte}</p>
            <p><i class="fas fa-dragon"></i> <strong>Stands que possui:</strong> ${portador.quantidadeStands}</p>
            <div style="display:flex; flex-wrap:wrap; gap:10px; margin:1.5rem 0;">
                ${portador.stands.map(stand => `<span style="background:#f1c40f22; border:1px solid #f1c40f66; padding:8px 16px; border-radius:40px;"><i class="fas fa-dice-d6"></i> ${stand}</span>`).join('')}
            </div>
            <hr style="margin:1rem 0; border-color:#f1c40f33;">
            <p style="font-size:0.8rem; color:#aaa;"><i class="fas fa-history"></i> Este personagem é um dos portadores de Stand na série JoJo's Bizarre Adventure.</p>
        `;
        modal.style.display = 'flex';
        
        const closeFn = () => modal.style.display = 'none';
        setTimeout(() => {
            const closeBtn = document.getElementById('closeModalBtnInner');
            if (closeBtn) closeBtn.onclick = closeFn;
        }, 100);
        document.getElementById('closeModalBtn').onclick = closeFn;
        window.onclick = (e) => { if(e.target === modal) closeFn(); };
    }

    // Setup Tabs
    function setupTabs() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTab = btn.getAttribute('data-tab');
                
                if (activeTab === 'stands') {
                    renderStands();
                } else {
                    renderPortadores();
                }
            });
        });
    }

    // Setup Filtros
    function setupFilters() {
        const btns = document.querySelectorAll('.filter-btn');
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.getAttribute('data-part');
                
                if (activeTab === 'stands') {
                    renderStands();
                } else {
                    renderPortadores();
                }
            });
        });
    }

    // Expor funções globalmente
    window.evolveStand = evolveStand;
    window.resetStand = resetStand;
    window.openStandModal = openStandModal;
    window.openUserModal = openUserModal;

    // Inicializar
    initEvolutionState();
    setupTabs();
    setupFilters();
    renderStands();
</script>
