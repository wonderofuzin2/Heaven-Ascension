// Função para obter a imagem do Stand (com fallback)
function getImagemStand(nomeStand, gradient) {
    const imagemUrl = imagensStands[nomeStand];
    
    if (imagemUrl) {
        // Retorna a URL da imagem
        return `url('${imagemUrl}')`;
    }
    // Fallback: retorna o gradiente original
    return gradient;
}

    // Variável de filtro ativo
    let activeFilter = "all";

    // Renderização dos cards
   function renderStands() {
    const container = document.getElementById('standsContainer');
    let filtered = standsDB;
    if (activeFilter !== "all") {
        filtered = standsDB.filter(stand => stand.parte === activeFilter);
    }
    
    document.getElementById('totalCounter').innerHTML = `🎴 ${filtered.length} STANDS ${activeFilter !== "all" ? `· ${activeFilter}` : "· TODAS AS PARTES"}`;
    
    container.innerHTML = filtered.map(stand => {
        // Obtém a imagem ou gradiente
        const imagemFundo = getImagemStand(stand.name, stand.gradient);
        
        return `
            <div class="stand-item" data-id="${stand.id}">
                <div class="stand-preview" style="background: ${imagemFundo}, url('https://via.placeholder.com/400x230/151515/3a2a1f?text=★'); background-size: cover; background-blend: overlay; background-position: center;">
                    <span class="part-tag"><i class="fas fa-tag"></i> ${stand.parte}</span>
                    <span class="power-badge"><i class="fas fa-chart-line"></i> ${stand.stats[0]?.split(':')[0] || 'Poder'}</span>
                </div>
                <div class="stand-content">
                    <div class="stand-title">${stand.name}</div>
                    <div class="stand-user"><i class="fas fa-user-astronaut"></i> ${stand.user}</div>
                    <div class="stand-desc-short">${stand.desc}</div>
                    <div class="stats-row">
                        ${stand.stats.slice(0, 4).map(s => `<span class="stat-chip"><i class="fas fa-dice-d6"></i> ${s}</span>`).join('')}
                    </div>
                    <button class="btn-details" data-id="${stand.id}"><i class="fas fa-eye"></i> VER MAIS</button>
                </div>
            </div>
        `;
    }).join('');
    
    // Reatribuir eventos de clique dos botões
    document.querySelectorAll('.btn-details').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(btn.getAttribute('data-id'));
            openModal(id);
        });
    });
    document.querySelectorAll('.stand-item').forEach(card => {
        card.addEventListener('click', (e) => {
            if(e.target.classList.contains('btn-details')) return;
            const id = parseInt(card.getAttribute('data-id'));
            openModal(id);
        });
    });
}
    
    function openModal(id) {
        const stand = standsDB.find(s => s.id === id);
        if (!stand) return;
        const modal = document.getElementById('standModal');
        const modalContent = document.getElementById('modalDynamicContent');
        modalContent.innerHTML = `
            <div class="modal-close" id="closeModalBtnInner">&times;</div>
            <div class="modal-stand-name">${stand.name}</div>
            <div style="display:flex; gap:8px; margin: 5px 0;"><span class="part-tag" style="background:#000000aa;">${stand.parte}</span> <span><i class="fas fa-user"></i> ${stand.user}</span></div>
            <div class="modal-desc-full" style="margin: 1rem 0; line-height:1.4;">🔮 ${stand.fullDesc || stand.desc}</div>
            <div class="modal-stats">
                ${stand.stats.map(stat => `<span style="background:#2e293c; padding:4px 12px; border-radius:30px;">⚡ ${stat}</span>`).join('')}
            </div>
            <div style="margin-top:1rem; font-size:0.7rem; color:#bfb48b;"><i class="fas fa-book-open"></i> "O Stand é a manifestação do espírito de luta"</div>
        `;
        modal.style.display = 'flex';
        
        const closeModalFn = () => modal.style.display = 'none';
        document.getElementById('closeModalBtnInner')?.addEventListener('click', closeModalFn);
        const oldClose = document.getElementById('closeModalBtn');
        if(oldClose) oldClose.onclick = closeModalFn;
        window.onclick = (e) => { if(e.target === modal) closeModalFn(); };
    }
    
    // FILTROS
    function setupFilters() {
        const btns = document.querySelectorAll('.filter-btn');
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.getAttribute('data-part');
                renderStands();
            });
        });
    }
    
    // Botão aleatório por menu (adicionei um painel de navegação)
    function addRandomButton() {
        const filterBar = document.getElementById('filterBar');
        const randomBtn = document.createElement('button');
        randomBtn.className = 'filter-btn';
        randomBtn.innerHTML = '<i class="fas fa-shuffle"></i> ALEATÓRIO';
        randomBtn.style.background = '#f1c40f22';
        randomBtn.addEventListener('click', () => {
            const randomId = Math.floor(Math.random() * standsDB.length) + 1;
            openModal(randomId);
        });
        filterBar.appendChild(randomBtn);
    }
    
    renderStands();
    setupFilters();
    addRandomButton();
</script>
