            justify-content: center;

            color: #f1c40f;

            border-radius: 40px;

    let evolutionState = {};

    function initEvolutionState() {
        for (let key in evolutionData) {

    function evolveStand(evolutionId, event) {
        if (event) event.stopPropagation();
        if (!evolutionData[evolutionId]) return;
        
        const current = evolutionState[evolutionId];
        const next = (current + 1) % evolutionData[evolutionId].forms.length;
        evolutionState[evolutionId] = next;
        
        const card = document.querySelector(`.stand-card[data-evo='${evolutionId}']`);
        if (card) {
            card.classList.add('evolving');
            setTimeout(() => card.classList.remove('evolving'), 500);
        }
        
        renderizarConteudo();
    }

    function resetStand(evolutionId, event) {
        if (event) event.stopPropagation();
        evolutionState[evolutionId] = 0;
        renderizarConteudo();
    }

    function getEvolutiveDisplay(stand) {
        const evoId = evolutiveIds[stand.name];
        if (evoId && evolutionData[evoId]) {
            const currentFormIndex = evolutionState[evoId] || 0;
            const currentForm = evolutionData[evoId].forms[currentFormIndex];
            const nextFormName = evolutionData[evoId].forms[(currentFormIndex + 1) % evolutionData[evoId].forms.length].name;
            const isMaxForm = currentFormIndex === evolutionData[evoId].forms.length - 1;
            
            return {
                isEvolutive: true,
                displayName: currentForm.name,
                displayDesc: currentForm.desc,
                displayStats: currentForm.stats,
                displayGradient: currentForm.gradient,
                nextFormName: nextFormName,
                isMaxForm: isMaxForm,
                evolutionId: evoId,
                currentFormIndex: currentFormIndex,
                totalForms: evolutionData[evoId].forms.length
            };
        }
        return {
            isEvolutive: false,
            displayName: stand.name,
            displayDesc: stand.desc,
            displayStats: stand.stats,
            displayGradient: stand.gradient
        };
    }

    function mostrarToast(mensagem, cor) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = cor;
        toast.innerHTML = mensagem;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = '0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    function registrarUsuario(nome, email, senha) {
        if (!nome || !email || !senha) { mostrarToast("❌ Preencha todos os campos!", "#e74c3c"); return false; }
        if (usuarios.some(u => u.email === email)) { mostrarToast("❌ E-mail já cadastrado!", "#e74c3c"); return false; }
        if (senha.length < 4) { mostrarToast("❌ Senha deve ter pelo menos 4 caracteres!", "#e74c3c"); return false; }
        usuarios.push({ id: Date.now(), nome, email, senha, favoritos: [], dataCadastro: new Date().toISOString() });
        salvarUsuarios();
        mostrarToast("✅ Cadastro realizado! Faça login.", "#2ecc71");
        return true;
    }

    function fazerLogin(email, senha) {
        const usuario = usuarios.find(u => u.email === email && u.senha === senha);
        if (usuario) {
            usuarioLogado = usuario;
            salvarSessao();
            atualizarBarraUsuario();
            fecharModalLogin();
            mostrarToast(`🎉 Bem-vindo, ${usuario.nome}!`, "#2ecc71");
            renderizarConteudo();
            return true;
        } else {
            mostrarToast("❌ E-mail ou senha incorretos!", "#e74c3c");
            return false;
        }
    }

    function fazerLogout() {
        usuarioLogado = null;
        sessionStorage.removeItem(STORAGE_SESSION);
        atualizarBarraUsuario();
        mostrarToast("👋 Você saiu da sua conta!", "#f39c12");
        if (activeFilter === "favoritos") { activeFilter = "all"; atualizarFiltros(); }
        renderizarConteudo();
    }

    function toggleFavorito(standId) {
        if (!usuarioLogado) { mostrarToast("🔐 Faça login para favoritar!", "#f39c12"); abrirModalLogin(); return false; }
        if (!usuarioLogado.favoritos) usuarioLogado.favoritos = [];
        const index = usuarioLogado.favoritos.indexOf(standId);
        index === -1 ? usuarioLogado.favoritos.push(standId) : usuarioLogado.favoritos.splice(index, 1);
        const userIndex = usuarios.findIndex(u => u.id === usuarioLogado.id);
        if (userIndex !== -1) usuarios[userIndex] = usuarioLogado;
        salvarUsuarios();
        atualizarBarraUsuario();
        renderizarConteudo();
        return true;
    }

    function isFavorito(standId) {
        return usuarioLogado && usuarioLogado.favoritos && usuarioLogado.favoritos.includes(standId);
    }

    function atualizarBarraUsuario() {
        const barra = document.getElementById('userBar');
        if (!barra) return;
        if (usuarioLogado) {
            barra.innerHTML = `
                <div class="user-info">
                    <div class="user-avatar">${usuarioLogado.nome.charAt(0).toUpperCase()}</div>
                    <div class="user-details">
                        <div class="user-name">${usuarioLogado.nome}</div>
                        <div class="user-email">${usuarioLogado.email}</div>
                        <div class="user-stats">❤️ ${usuarioLogado.favoritos?.length || 0} favoritos</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="fazerLogout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
            `;
        } else {
            barra.innerHTML = `
                <div class="user-info"><div class="welcome-badge"><i class="fas fa-user-friends"></i> Visitante</div></div>
                <div><button class="register-btn" onclick="abrirModalRegister()"><i class="fas fa-user-plus"></i> Cadastrar</button>
                <button class="login-btn" onclick="abrirModalLogin()"><i class="fas fa-sign-in-alt"></i> Entrar</button></div>
            `;
        }
    }

    // MODAIS
    let currentModalMode = 'login';

    function renderizarModalLogin() {
        const container = document.getElementById('modalContent');
        if (!container) return;
        if (currentModalMode === 'login') {
            container.innerHTML = `
                <div class="login-header"><h2>ENTRAR</h2><p>Faça login para favoritar seus Stands</p></div>
                <div class="input-group"><label>E-MAIL</label><input type="email" id="loginEmail" placeholder="seu@email.com"></div>
                <div class="input-group"><label>SENHA</label><input type="password" id="loginSenha" placeholder="••••••"></div>
                <button class="login-btn-submit" id="submitLoginBtn">ENTRAR</button>
                <div class="switch-auth">Não tem conta? <a id="switchToRegister">CADASTRE-SE</a></div>
            `;
            document.getElementById('submitLoginBtn')?.addEventListener('click', () => {
                fazerLogin(document.getElementById('loginEmail').value, document.getElementById('loginSenha').value);
            });
            document.getElementById('switchToRegister')?.addEventListener('click', () => {
                currentModalMode = 'register';
                renderizarModalLogin();
            });
        } else {
            container.innerHTML = `
                <div class="login-header"><h2>CADASTRO</h2><p>Crie sua conta e favorite seus Stands</p></div>
                <div class="input-group"><label>NOME</label><input type="text" id="registerNome" placeholder="Seu nome"></div>
                <div class="input-group"><label>E-MAIL</label><input type="email" id="registerEmail" placeholder="seu@email.com"></div>
                <div class="input-group"><label>SENHA</label><input type="password" id="registerSenha" placeholder="mínimo 4 caracteres"></div>
                <button class="login-btn-submit" id="submitRegisterBtn">CADASTRAR</button>
                <div class="switch-auth">Já tem conta? <a id="switchToLogin">FAÇA LOGIN</a></div>
            `;
            document.getElementById('submitRegisterBtn')?.addEventListener('click', () => {
                const nome = document.getElementById('registerNome').value;
                const email = document.getElementById('registerEmail').value;
                const senha = document.getElementById('registerSenha').value;
                if (registrarUsuario(nome, email, senha)) {
                    currentModalMode = 'login';
                    renderizarModalLogin();
                }
            });
            document.getElementById('switchToLogin')?.addEventListener('click', () => {
                currentModalMode = 'login';
                renderizarModalLogin();
            });
        }
    }

    function abrirModalLogin() { currentModalMode = 'login'; renderizarModalLogin(); document.getElementById('loginModal').style.display = 'flex'; }
    function abrirModalRegister() { currentModalMode = 'register'; renderizarModalLogin(); document.getElementById('loginModal').style.display = 'flex'; }
    function fecharModalLogin() { document.getElementById('loginModal').style.display = 'none'; }

    function abrirModalDetalhes(stand) {
        const modal = document.getElementById('detailsModal');
        const content = document.getElementById('detailsContent');
        const imagemFundo = getImagemStand(stand.name);
        content.innerHTML = `
            <h2 style="color:#ffd966;">${stand.name}</h2>
            <p><strong>Portador:</strong> ${stand.user}</p>
            <p><strong>Parte:</strong> ${stand.parte}</p>
            <div style="height:180px; background:${imagemFundo || stand.gradient}; background-size:cover; background-position:center; border-radius:20px; margin:1rem 0;"></div>
            <p style="margin:1rem 0;">${stand.fullDesc}</p>
            <div class="stats-row">${stand.stats.map(s => `<span class="stat-chip">⚡ ${s}</span>`).join('')}</div>
            <button class="fav-btn ${isFavorito(stand.id) ? 'active' : ''}" onclick="toggleFavorito(${stand.id}); abrirModalDetalhes(standsData.find(s => s.id === ${stand.id}));">
                <i class="fas fa-heart"></i> ${isFavorito(stand.id) ? ' REMOVER DOS FAVORITOS' : ' ADICIONAR AOS FAVORITOS'}
            </button>
        `;
        modal.style.display = 'flex';
    }

    function abrirModalPortador(portador) {
        const modal = document.getElementById('detailsModal');
        const content = document.getElementById('detailsContent');
        content.innerHTML = `
            <h2 style="color:#ffd966;">${portador.nome}</h2>
            <p><strong>Parte:</strong> ${portador.parte}</p>
            <p><strong>Stands:</strong> ${portador.quantidadeStands}</p>
            <div style="display:flex; flex-wrap:wrap; gap:10px; margin:1rem 0;">
                ${portador.stands.map(s => `<span style="background:#f1c40f22; padding:8px 16px; border-radius:40px;">${s}</span>`).join('')}
            </div>
        `;
        modal.style.display = 'flex';
    }

    function fecharModalDetalhes() { document.getElementById('detailsModal').style.display = 'none'; }

        // RENDERIZAÇÃO PRINCIPAL CORRIGIDA
    function renderizarConteudo() {
        let dados = [];
        let totalCount = 0;
        
        if (activeTab === 'stands') {
            dados = [...standsData];
            if (activeFilter === "favoritos") {
                if (usuarioLogado && usuarioLogado.favoritos) {
                    dados = standsData.filter(stand => usuarioLogado.favoritos.includes(stand.id));
                } else {
                    dados = [];
                    if (!usuarioLogado) mostrarToast("🔐 Faça login para ver seus favoritos!", "#f39c12");
                }
            } else if (activeFilter !== "all") {
                dados = standsData.filter(stand => stand.parte === activeFilter);
            }
            totalCount = dados.length;
            document.getElementById('totalCounter').innerHTML = `🎴 ${totalCount} STANDS ${activeFilter !== "all" && activeFilter !== "favoritos" ? `· ${activeFilter}` : (activeFilter === "favoritos" ? "· FAVORITOS" : "")}`;
        } else {
            dados = [...portadores];
            if (activeFilter !== "all" && activeFilter !== "favoritos") {
                dados = portadores.filter(p => p.parte === activeFilter);
            }
            totalCount = dados.length;
            document.getElementById('totalCounter').innerHTML = `👥 ${totalCount} PORTADORES ${activeFilter !== "all" && activeFilter !== "favoritos" ? `· ${activeFilter}` : ""}`;
        }

        const container = document.getElementById('standsContainer');
        if (dados.length === 0) {
            container.innerHTML = '<div class="no-results"><i class="fas fa-search"></i> Nenhum resultado encontrado.</div>';
            return;
        }

        if (activeTab === 'stands') {
    container.innerHTML = dados.map(stand => {
        const evo = getEvolutiveDisplay(stand);
        const actBadgeText = evo.isEvolutive ? 
            (evo.displayName.includes("ACT") ? evo.displayName.split(" ")[1] : 
            (evo.displayName.includes("Requiem") ? "REQUIEM" : 
            (evo.displayName.includes("The World") && evo.displayName !== "The World" ? "EVOLVED" : 
            (evo.currentFormIndex > 0 ? `FORM ${evo.currentFormIndex +1}/${evo.totalForms}` : "BASE")))) : "";
        
        // PEGA A IMAGEM CORRETA (base ou evoluída)
        const imagemDoStand = getImagemStand(stand.name, evo.displayName);
        
        return `
        <div class="stand-card" data-id="${stand.id}" data-evo="${evo.isEvolutive ? evo.evolutionId : ''}">
            <div class="stand-preview" style="background: ${imagemDoStand ? imagemDoStand : evo.displayGradient}, url('https://via.placeholder.com/400x200/151515/3a2a1f?text=★'); background-size: cover; background-blend: overlay;">
                <span class="part-tag">${stand.parte}</span>
                ${evo.isEvolutive && actBadgeText ? `<span class="act-badge"><i class="fas fa-star"></i> ${actBadgeText}</span>` : ''}
                ${isFavorito(stand.id) ? '<span class="fav-badge"><i class="fas fa-heart"></i> FAVORITO</span>' : ''}
            </div>
            <div class="stand-content">
                <div class="stand-title">
                    ${evo.displayName}
                    ${evo.isEvolutive ? `<button class="reset-btn" onclick="resetStand('${evo.evolutionId}', event)" title="Resetar"><i class="fas fa-undo-alt"></i></button>` : ''}
                </div>
                <div class="stand-user"><i class="fas fa-user"></i> ${stand.user}</div>
                <div class="stand-desc">${evo.displayDesc}</div>
                <div class="stats-row">${evo.displayStats.slice(0,3).map(s => `<span class="stat-chip">${s}</span>`).join('')}</div>
                ${evo.isEvolutive ? `
                    <button class="evo-btn" onclick="evolveStand('${evo.evolutionId}', event)">
                        <i class="fas ${evo.isMaxForm ? 'fa-arrow-rotate-left' : 'fa-arrow-up'}"></i>
                        ${evo.isMaxForm ? `VOLTAR PARA ${evolutionData[evo.evolutionId].forms[0].name}` : `EVOLUIR PARA ${evo.nextFormName}`}
                    </button>
                ` : `
                    <button class="btn-details" onclick="abrirModalDetalhes(standsData.find(s => s.id === ${stand.id}))"><i class="fas fa-eye"></i> VER DETALHES</button>
                `}
                <button class="fav-btn ${isFavorito(stand.id) ? 'active' : ''}" onclick="toggleFavorito(${stand.id})">
                    <i class="fas fa-heart"></i> ${isFavorito(stand.id) ? ' FAVORITADO' : ' FAVORITAR'}
                </button>
            </div>
        </div>
    `}).join('');
        } else {
            container.innerHTML = dados.map(port => {
                const imagemPortador = getImagemPortador(port.nome);
                return `
                <div class="user-card" onclick="abrirModalPortador(portadores.find(p => p.nome === '${port.nome.replace(/'/g, "\\'")}'))">
                    <div class="user-preview" style="background: ${imagemPortador ? imagemPortador : 'linear-gradient(135deg, #1a1a2e, #16213e)'}; background-size: cover; background-position: center;">
                        <span class="part-tag">${port.parte}</span>
                        <span class="fav-badge" style="background:#f1c40faa; color:#0a0a0a;">${port.quantidadeStands} Stand(s)</span>
                    </div>
                    <div class="user-content">
                        <div class="stand-title"><i class="fas fa-user-circle"></i> ${port.nome}</div>
                        <div class="stand-desc">${port.desc}</div>
                        <button class="btn-details" onclick="event.stopPropagation(); abrirModalPortador(portadores.find(p => p.nome === '${port.nome.replace(/'/g, "\\'")}'))">VER STANDS</button>
                    </div>
                </div>
            `}).join('');
        }
    }

    function atualizarFiltros() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-part') === activeFilter) btn.classList.add('active');
        });
    }

    function setupEventos() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTab = btn.getAttribute('data-tab');
                renderizarConteudo();
            });
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.getAttribute('data-part');
                renderizarConteudo();
            });
        });

        document.getElementById('closeLoginModalBtn')?.addEventListener('click', fecharModalLogin);
        document.getElementById('closeDetailsModalBtn')?.addEventListener('click', fecharModalDetalhes);
        window.onclick = (e) => {
            if (e.target === document.getElementById('loginModal')) fecharModalLogin();
            if (e.target === document.getElementById('detailsModal')) fecharModalDetalhes();
        };
    }

    // EXPOR FUNÇÕES
    window.toggleFavorito = toggleFavorito;
    window.abrirModalLogin = abrirModalLogin;
    window.abrirModalRegister = abrirModalRegister;
    window.fazerLogout = fazerLogout;
    window.abrirModalDetalhes = abrirModalDetalhes;
    window.abrirModalPortador = abrirModalPortador;
    window.evolveStand = evolveStand;
    window.resetStand = resetStand;

    // INICIALIZAR
    initEvolutionState();
    carregarDados();
    setupEventos();
    renderizarConteudo();
</script>
</body>
</html>
